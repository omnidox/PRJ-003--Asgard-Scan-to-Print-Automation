<template>
    <qp-panel id="TCAssignpalletfilterView" caption="Assign Pallet">

            <qp-fieldset id="TCAssignpalletfilterView_CstPXLayoutRule170"
                wg-container="TCAssignpalletfilterView_CstFormView16" view.bind="TCAssignpalletfilterView" slot="A"
                caption="Enter Pallet for Packages">
                <field name="palletID"></field>
                <field name="PackageStart"></field>
                <field name="PackageEnd"></field>
            </qp-fieldset>

        <qp-template id="form-TCDeletepallet" name="17-17-14" class="equal-height">

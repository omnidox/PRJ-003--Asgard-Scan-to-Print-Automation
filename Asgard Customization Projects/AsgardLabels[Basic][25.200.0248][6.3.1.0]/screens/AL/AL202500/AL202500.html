<template>
    <qp-upload-dialog id="uploadFileDialog"
                      caption="Upload XML Zip"
                      key="Document"
                      session-key="XmlUploadAllEntities"
                      allowed-types=".zip"></qp-upload-dialog>
    <qp-template id="form_30" name="1-1-1" qp-collapsible>
        <qp-fieldset id="Document_form0_fs0"
                     wg-container="Document_form"
                     view.bind="Document"
                     slot="A">
            <field name="Name"></field>
            <field name="Description"></field>
            <field name="PrimaryColor" control-type="qp-color-picker"></field>
            <field name="CategoryID"></field>
        </qp-fieldset>
        <qp-fieldset id="Document_form1_fs1"
                     wg-container="Document_form"
                     view.bind="Document"
                     slot="B">
            <field name="Active"></field>
            <field name="IsSystem"></field>
            <field name="IsComposite"></field>
            <field name="AllowExport"></field>
            <using view="CurrentDocument"
                   id="usCurrentDocument_VisibilityForm1"
                   wg-container="CurrentDocument_VisibilityForm">
                <field name="ShowChildren"></field>
            </using>
        </qp-fieldset>
        <qp-fieldset id="Document_form2_fs2"
                     wg-container="Document_form"
                     view.bind="Document"
                     slot="C">
            <field name="Alpha"></field>
            <field name="Red"></field>
            <field name="Green"></field>
            <field name="Blue"></field>
        </qp-fieldset>
    </qp-template>
    <qp-tabbar id="tab">
        <qp-tab id="tab0" caption="Rule Details">
            <qp-grid id="subGrid" view.bind="Rules"></qp-grid>
        </qp-tab>
        <qp-tab id="tab1" caption="Used by Expressions">
            <qp-grid id="gridUsedByExpressions" view.bind="UsedByExprs"></qp-grid>
        </qp-tab>
        <qp-tab id="tab2" caption="Used by Rules">
            <qp-grid id="gridUsedByRules" view.bind="UsedByRules"></qp-grid>
        </qp-tab>
    </qp-tabbar>
    <qp-panel id="ChangeIDDialog" caption="Specify New ID" auto-repaint="true">
        <qp-fieldset id="ChangeIDDialog_rlAcctCD_fs0"
                     wg-container="ChangeIDDialog_formChangeID"
                     view.bind="ChangeIDDialog">
            <field name="Name"></field>
        </qp-fieldset>
        <footer>
            <qp-button id="btnOK"
                       caption="OK"
                       state.bind="Save"
                       dialog-result="OK"></qp-button>
            <qp-button id="PXButton3"
                       caption="Cancel"
                       dialog-result="Cancel"></qp-button>
        </footer>
    </qp-panel>
</template>

<template>
    <qp-upload-dialog id="uploadFileDialog"
                      caption="Upload XML Zip"
                      key="Document"
                      session-key="XmlUploadAllEntities"
                      allowed-types=".zip"></qp-upload-dialog>
    <qp-template id="form_30" name="1-1-1" qp-collapsible="true" class="equal-height">
        <qp-fieldset id="Document_form0_fs0"
                     wg-container="Document_form"
                     view.bind="Document"
                     slot="A">
            <field name="Name"></field>
            <field name="Description"></field>
            <field name="ScreenID"></field>
            <field name="GraphType"></field>
            <field name="StandardID" config-allow-edit.bind="true"></field>
            <field name="FormatID" config-allow-edit.bind="true"></field>
            <field name="BarcodeID" config-allow-edit.bind="true"></field>
            <field name="CategoryID" config-allow-edit.bind="true"></field>
        </qp-fieldset>
        <qp-fieldset id="Document_form1_fs1"
                     wg-container="Document_form"
                     view.bind="Document"
                     slot="B">
            <field name="Active"></field>
            <field name="IsSystem"></field>
            <field name="AllowExport"></field>
            <field name="Message" config-type.bind="1" config-rows.bind="6"></field>
        </qp-fieldset>
        <qp-fieldset id="CurrentDocument_templateDataForm_fs2"
                     wg-container
                     view.bind="CurrentDocument"
                     slot="C">
            <field name="ImageUrl" control-type="qp-image-view"></field>
        </qp-fieldset>
    </qp-template>
    <qp-tabbar id="tab">
        <qp-tab id="tab0" caption="Elements">
            <qp-grid id="gridElements" view.bind="Elements"></qp-grid>
        </qp-tab>
        <qp-tab id="tab1" caption="Used By Data Elements">
            <qp-grid id="gridUsedByDataElements"
                     view.bind="UsedByDataElements"></qp-grid>
        </qp-tab>
    </qp-tabbar>
    <qp-panel id="ChangeIDDialog" caption="Specify New ID" auto-repaint="true">
        <qp-fieldset id="ChangeIDDialog_rlAcctCD_fs0"
                     wg-container="ChangeIDDialog_formChangeID"
                     view.bind="ChangeIDDialog">
            <field name="Name"></field>
        </qp-fieldset>
        <footer>
            <qp-button id="btnOK"
                       caption="OK"
                       state.bind="Save"
                       dialog-result="OK"></qp-button>
            <qp-button id="PXButton3"
                       caption="Cancel"
                       dialog-result="Cancel"></qp-button>
        </footer>
    </qp-panel>
</template>

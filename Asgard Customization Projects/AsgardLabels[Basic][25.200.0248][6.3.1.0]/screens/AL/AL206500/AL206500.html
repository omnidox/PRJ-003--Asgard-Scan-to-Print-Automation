<template>
    <qp-upload-dialog id="uploadFileDialog"
                      caption="Upload XML Zip"
                      key="Document"
                      session-key="XmlUploadAllEntities"
                      allowed-types=".zip"></qp-upload-dialog>
    <qp-template id="form_20" name="17-7" qp-collapsible="true" class="equal-height">
        <qp-fieldset id="Document_form0_fs0"
                     wg-container="Document_form"
                     view.bind="Document"
                     slot="A">
            <field name="Name"></field>
            <field name="Description"></field>
            <field name="CategoryID"></field>
            <field name="TypeName"></field>
            <field name="FunctionName"></field>
            <field name="Signature" config-type.bind="1" config-rows.bind="4"></field>
            <field name="InternalName"></field>
            <field name="ReturnTypeName"></field>
        </qp-fieldset>
        <qp-fieldset id="Document_form1_fs1"
                     wg-container="Document_form"
                     view.bind="Document"
                     slot="B">
            <field name="Active"></field>
            <field name="IsComposite"></field>
            <field name="IsSystem"></field>
            <field name="AllowExport"></field>
            <!--<using view="CurrentDocument"
                   id="usCurrentDocument_VisibilityForm1"
                   wg-container="CurrentDocument_VisibilityForm">
                <field name="ShowChildren"></field>
            </using>-->
        </qp-fieldset>
    </qp-template>
    <qp-tabbar id="tab">
        <qp-tab id="tab0" caption="Substitution Details" visible.bind="Document.ShowChildren.value === true">
            <qp-grid id="subGrid" view.bind="SubstitutionDetails"></qp-grid>
        </qp-tab>
        <qp-tab id="tab1" caption="Used By Composites">
            <qp-grid id="gridDataComposites" view.bind="UsedByComposites"></qp-grid>
        </qp-tab>
        <qp-tab id="tab2" caption="Used By Data Elements">
            <qp-grid id="gridDataElements" view.bind="UsedByDataElements"></qp-grid>
        </qp-tab>
        <qp-tab id="tab3" caption="Used By Content Elements">
            <qp-grid id="gridContentElements"
                     view.bind="UsedByContentElements"></qp-grid>
        </qp-tab>
    </qp-tabbar>
    <qp-panel id="ChangeIDDialog" caption="Specify New ID" auto-repaint="true">
        <qp-fieldset id="ChangeIDDialog_rlAcctCD_fs0"
                     wg-container="ChangeIDDialog_formChangeID"
                     view.bind="ChangeIDDialog">
            <field name="Name"></field>
        </qp-fieldset>
        <footer>
            <qp-button id="btnOK"
                       caption="OK"
                       state.bind="Save"
                       dialog-result="OK"></qp-button>
            <qp-button id="PXButton3"
                       caption="Cancel"
                       dialog-result="Cancel"></qp-button>
        </footer>
    </qp-panel>
</template>
